; AdvancedFireflies.asi - fireflies: groups, swarms, look, glow and interaction with vehicles, peds and rotors.
; A value outside the allowed range is clamped - the log says so in a 'NOTE [...]' line.
; If you have problems with reflections use cheat "REFLOG" to start, and then use it again to stop - crreated AdvancedFireflies_reflections.log is useful for the author to pinpoint the problem.
; Without FxsFuncs with high values of LimitAdjusterMult you will be limited in what you see (I use 32 multiplier, but in most cases 8-16 is fine).
; Most changes can be reloaded in game with the cheat "FFLIES".

[Effects]
; Effect names (systems from effects.fxp / .fxs files), separated by commas.
Load = advanced_firefly.fxs, advanced_fairytrail.fxs  ; own effect files from the mod folder (changes need a game restart)
Collision = advanced_firefly                ; bounce off vehicles, the player and peds
KillOnHit = advanced_firefly                ; die when hit faster than KillOnHitSpeed
KillOnHitSpeed = 100                        ; km/h
HitsToKill = 5                              ; this many slower hits kill a firefly (0 = never)
HitMinSpeed = 10                             ; km/h - a slower hit does not count
; blown around by the downwash of helicopters, the Hydra (VTOL) and the Vortex (smoke too, e.g. teargas)
RotorWash = advanced_firefly, teargas, teargasAD, smoke_flare, riot_smoke, spraycan, extinguisher, smoke30lit, smoke30m, smoke50lit, WS_factorysmoke, exhale, cigarette_smoke, gunsmoke, prt_collisionsmoke, prt_smoke_huge, prt_smokeII_3_expand
KillByRotor = advanced_firefly              ; die in a spinning rotor disc
Glow = advanced_firefly                     ; glow - settings in [Glow]
Look = advanced_firefly                     ; own texture and look variants - [Look] and the group sections
TrailEffect = advanced_fairytrail           ; particle effect of the FairyTrail (from advanced_fairytrail.fxs)
TrailReserve = 1000                         ; no trail when the game has fewer free FX particles than this
TrailMaxParticles = 20000                   ; max trail particles at once (all groups together)

[Glow]
; A few fireflies nearest to the player flare up and fade, then the light moves on to others.
Color = 150,255,60                          ; light colour R,G,B when LightUsesFireflyColor = 0
LightUsesFireflyColor = 1                   ; 1 = light and corona in the colour of that firefly
Strength = 30                               ; overall brightness of the light and corona in %
PointLights = 1                             ; 1 = point light (lights up the surroundings)
Coronas = 0                                 ; 1 = corona (could be useful, by default off)
MaxLights = 28                              ; how many flare up at once (max 28)
SteadyLights = 64                           ; how many of the nearest fireflies have a steady light (0-64; 0 = light only while flaring, high may be limited by the game)
IdleLight = 20                              ; % light strength while not flaring (flare = 100%)
; note: the game has 32 point lights per frame for everything (headlights, fire...) - SteadyLights uses them up
LightDistance = 40                          ; m from the player within which glowing fireflies are picked
LightRadius = 30                            ; light radius in dm (30 = 3 m)
BlinkMin = 500                              ; flare time in ms - random in BlinkMin..BlinkMax
BlinkMax = 1000

[Look]
; The firefly texture is drawn by the plugin at game start (white - the colour comes from Colors in the group section).
AdvancedTexture = 1                         ; 1 = glow with an insect, 0 = glow only
InsectSize = 20                             ; wing span in % of the glow diameter (5-60)
TextureSize = 64                            ; px, 16-256, a power of two
CoreSize = 16                               ; radius of the bright core in % of the radius
CoreShare = 50                              ; % of the brightness in the core (the rest is the halo)
HaloFalloff = 14                            ; halo falloff x10 (10 = linear, 20 = faster)
; halo colour relative to the core in % R,G,B - below 100 makes the core whiter but filters the Colors
HaloTint = 100,100,100

[Reflections]
; Reflections of fireflies (and their FairyTrail) in water - a mirror drawn by the plugin,
; independent of shaders (the SSR water reflections of Proper Shaders cannot see FX particles).
Water = 1                                   ; 1 = fireflies are reflected in water
Trail = 1                                   ; 1 = the FairyTrail is reflected too
Distance = 250                              ; m from the camera up to which reflections are made (10-250)
StrengthLowAngle = 70                       ; % reflection brightness when looking low over the water
StrengthTopDown = 70                        ; % brightness when looking straight down
Ripple = 3                                  ; cm - ripple of the reflection (0 = smooth mirror)
MaxReflections = 20000                      ; max reflections at once, 0-30000 (with more trail particles every n-th one is reflected)
SurfaceOffset = 50                          ; cm - the reflection sits this far in front of the surface (towards the camera), 0-200
ShoreTolerance = 10                         ; cm - ground up to this height above the water still counts as water (shore), -100..100
MirrorHeight = -10                          ; cm - mirror plane offset from the calm water level (- lower = reflections lower), -300..300

[TrailWake]
; The FairyTrail is blown apart by passing vehicles: a particle a vehicle flies through gets a push,
; flies apart and fades faster (it is not removed or moved). Each particle only once.
Enabled = 1                                 ; 1 = on
AircraftOnly = 1                            ; 1 = helicopters and planes only, 0 = all vehicles
Radius = 30                                 ; dm - range around the vehicle body (helicopter: around the rotor disc)
MinSpeed = 20                               ; km/h - a slower vehicle does not blow (a helicopter with a spinning rotor always does)
Push = 40                                   ; % of the vehicle speed - push sideways away from its flight line
Drag = 20                                   ; % of the vehicle speed - drag along the flight direction (negative = backwards)
Scatter = 100                               ; cm/s - random scatter in every direction
Life = 8000                                 ; ms - max remaining life of a blown particle (fades smoothly)

[DeathBurst]
; A firefly killed by us (too fast a hit, HitsToKill, a rotor) bursts into FairyTrail particles of its own colour.
Enabled = 1                                 ; 1 = on
Particles = 8                               ; number of particles
Speed = 300                                 ; cm/s - burst speed
Life = 800                                  ; ms - life (+-30%)
Size = 100                                  ; % of the firefly size (1-500)
Brightness = 100                            ; % brightness at the start (1-100)
InheritSpeed = 30                           ; % of the speed of the vehicle that killed it (the particles fly along)

; ======================= FIREFLY GROUPS =======================
; Stationary - groups hover where they were born, 2.5 m above the ground or water.
; Wandering  - swarms are born far from the player and fly towards him at the set height with an offset.
; Besides the 4 built-in groups you can add 10 of your own: [CustomGroup0] .. [CustomGroup9] (examples at the end of the file).
; No CustomGroupN section or Enabled = 0 = group off; Wandering = 1 makes it a swarm.
;
; Where groups may be born (checked for every birth point, not for the player position):
;   Levels       = cities from data\map.zon: countryside, los santos, san fierro, las venturas, all
;   IncludeZones = zones from data\info.zon - a part name (e.g. GLN1b) or a district label (e.g. GLN)
;   ExcludeZones = zones where groups are NOT born, even if they match the above
; Weathers (DisableInWeather): 8 = rain SF, 16 = rain countryside, 19 = sandstorm, 9 = fog SF.
; Over water a group is born when the water is shallow (WaterMaxDepth) OR the shore is near (WaterMaxShoreDistance).

[LargeStationaryGroups]
Enabled = 1                                 ; 0 = group off
Effect = advanced_firefly                   ; effect name
Groups = 30                                 ; groups at once (max 64)
FirefliesPerGroup = 20                      ; fireflies per group
FixedMembers = 0                            ; 1 = the whole group is born at once, nobody joins later, nobody dies of age
; -- time, weather, terrain --
NightFrom = 19                              ; hour from which there are fireflies (inclusive); NightFrom = NightTo = all day
NightTo = 7                                 ; hour until which they are (exclusive)
DisableInWeather = 8, 16, 19, 9             ; weathers without fireflies (empty = none)
AllowRoads = 0                              ; 1 = may be born over tarmac/pavement/concrete
OverWater = 1                               ; 0 = never over water
WaterMaxDepth = 30                          ; dm (30 = 3 m) - shallow water anywhere
WaterMaxShoreDistance = 15                  ; m from the shore - deeper water only near the shore
; -- place --
SpawnRadius = 200                           ; m, birth radius (max DespawnRadius - 10)
ScaleWithArea = 1                           ; 1 = fewer groups when little allowed land is around (e.g. a city border)
DespawnRadius = 240                         ; m after which the group disappears (max 250)
MinGroupDistance = 45                       ; m between birth places of groups of this kind
Levels = countryside
IncludeZones = HILLP, CUNTC1, CUNTC3, ROBAD, WHET, FLINTC
ExcludeZones = SMB, VERO4A, VERO4B, RIH3A, RIH3B, RIH4, RIH2, RIH5A, RIH5B, MUL, MULINT, GLN1B, CHC, PALO, MONT, MONINT, MAKO, HBARNS, FALLO, DILLI, BLUEB, BLUAC, MART, EBAY, CUNTC2, GANTB, BONE, DAM, ELQUE, SUNNN, SUNMA, BARRA, QUARY
; -- firefly motion inside the group --
Jitter = 20                                 ; trembling in %
Wander = 100                                ; smooth wandering (cm/s or something around it)
Attraction = 20                             ; pull towards the group centre (more = tighter)
; -- look (every firefly picks a variant from the lists) --
Sizes = 60, 80, 100                         ; % of the size, max 150
IdleSize = 85                               ; % size while not glowing
GlowSize = 120                              ; % size while flaring
Colors = 64,255,128 | 64,255,64 | 0,255,64  ; R,G,B variants separated by |
Brightness = 30, 45, 60                     ; % brightness while not glowing
GlowBrightness = 100                        ; % brightness while flaring
SameForGroup = 0                            ; 1 = the whole group has the same size and colour
; -- FairyTrail: a glowing trail behind every firefly (in its colour, fades like smoke) --
FairyTrail = 0                              ; 1 = on
FairyTrailRate = 15                         ; particles per second from each firefly (0-2000)
FairyTrailLife = 1500                       ; ms - how long a particle lives and fades (50-120000)
FairyTrailSpread = 0                        ; cm - sideways spread from the flight path (0 = straight line, max 100000)
FairyTrailScatter = 0                       ; cm/s - drifting sideways away from the path (max 100000)
FairyTrailDrift = 0                         ; cm/s - vertical drift: negative down, positive up (+-100000)
FairyTrailDistance = 100                    ; m from the player within which fireflies leave a trail (1-250)
FairyTrailSize = 50                         ; % of the firefly size (1-500)
FairyTrailBrightness = 70                   ; % brightness at the start, then fades to 0 (1-100)

