; ==============================================================================================================
; AdvancedFireflies - group type
; Every .ini file in the GroupsSettings folder with a [Groups] section is one group type - its name is the file name.
; Enabled = 0 = not loaded. Share a group by sharing its file. Most changes (and new files) reload in game with "FFLIES".
; The keys are grouped by topic - every block is explained right above its keys.
; ==============================================================================================================

[Groups]                                    ; wandering day butterflies - where both kinds of stationary fireflies live at night
; Small wandering swarms of butterflies by day, born where LargeStationaryGroups or SmallStationaryGroups live at
; night (both zone lists merged). They fly low and slowly, meandering.

; ---------- THE GROUP -------------------------------------------------------------------------------------------
; Wandering = 0: stationary groups - they hover where they were born, HoverHeight above the ground or water.
; Wandering = 1: wandering swarms - born far from the player, they fly towards him at the set height with an offset.
;   Blocks marked (stationary groups) / (wandering swarms) below are used by that kind only.
Enabled = 1                                 ; 0 = group off
Wandering = 1                               ; 0 = stationary groups, 1 = wandering swarms
Effect = advanced_firefly                   ; effect name (a system loaded in [Effects] of the Base file)
Groups = 25                                  ; groups at once (max 64)
FirefliesPerGroup = 15                       ; fireflies per group
FixedMembers = 1                            ; 1 = the whole group is born at once, nobody joins later, nobody dies of age

; ---------- WHEN: hours and weather -----------------------------------------------------------------------------
NightFrom = 7                               ; hour from which there are fireflies (inclusive); NightFrom = NightTo = all day
NightTo = 19                                ; hour until which they are (exclusive)
; weathers: 8 = rain SF, 16 = rain countryside, 19 = sandstorm, 9 = fog SF
DisableInWeather = 8, 16, 19, 9             ; weathers without fireflies (empty = none)

; ---------- WHERE: cities and zones -----------------------------------------------------------------------------
; Checked for every birth point, not for the player position (a pinned group: at the thing it is pinned to).
;   Levels       = cities from data\map.zon: countryside, los santos, san fierro, las venturas, all
;   IncludeZones = zones from data\info.zon - a part name (e.g. GLN1b) or a district label (e.g. GLN)
;   ExcludeZones = zones where groups are NOT born, even if they match the above
Levels = countryside                        ; countryside, los santos, san fierro, las venturas, all (empty = only IncludeZones)
IncludeZones = HILLP, CUNTC1, CUNTC3, ROBAD, WHET, FLINTC, GLN1, BLUF, SMB, LDOC3C, ROD5A, ROD5B, VERO4A, VERO4B, MAR1, RIH3A, RIH3B, RIH4, RIH2, RIH5A, RIH5B, MUL, MULINT, GLN1B, CHC, NROCK, FISH, PALO, MONT, MONINT, MAKO, FERN, TOPFA, HBARNS, FALLO, DILLI, BLUEB, BLUAC, MART, PANOP, EBAY, SILLY1, MTCHI3, SILLY4, SILLY3, CUNTC, GARC, OCEAF, CITYS, WESTP, BAYV, PARA, CIVI, JUNIHI, JUNIHO, BATTP, SFAIR5, BONE, YBELL, PIRA, GGC, BINT, BFC, RIE, LDM, RSW, RSE ; zones from data\info.zon - part name (e.g. GLN1b) or district label (e.g. GLN)
ExcludeZones = GANTB, DAM, ELQUE, SUNNN, SUNMA, BARRA, QUARY ; zones where groups are NOT born, even if they match the above

; ---------- WHERE: roads and water (not used by pinned groups) --------------------------------------------------
; Over water a group is born when the water is shallow (WaterMaxDepth) OR the shore is near (WaterMaxShoreDistance).
AllowRoads = 1                              ; 1 = may be born over tarmac/pavement/concrete
OverWater = 1                               ; 0 = never over water
WaterMaxDepth = 30                          ; dm (30 = 3 m) - shallow water anywhere
WaterMaxShoreDistance = 15                  ; m from the shore - deeper water only near the shore

; ---------- INTERIORS -------------------------------------------------------------------------------------------
Interiors = 0                               ; 0 = outdoors only, 1 = also in interiors, 2 = interiors only (wandering swarms always stay outdoors)
InteriorSpawnRadius = 15                    ; m - indoors groups appear this close to the player, in the same room

; ---------- BIRTH AND DESPAWN -----------------------------------------------------------------------------------
; stationary groups (and pinned groups): born within SpawnRadius of the player
SpawnRadius = 90                            ; m, birth radius (max DespawnRadius - 10)
ScaleWithArea = 1                           ; 1 = fewer groups when little allowed land is around (e.g. a city border)
HoverHeight = 120                           ; cm - stationary groups: height of the group above the ground or water (indoors always 1.5 m)
; wandering swarms: born SpawnDistanceMin..Max from the player, a new one every SpawnInterval
SpawnDistanceMin = 60                       ; m from the player - the swarm is born at a distance in this range
SpawnDistanceMax = 100                      ; (the effect is drawn up to ~250 m)
SpawnInterval = 12                          ; s between births of consecutive swarms
; all groups: where they disappear, how far apart they are born
DespawnRadius = 130                         ; m after which the group disappears (max 250)
MinGroupDistance = 30                       ; m between birth places of groups of this kind

; ---------- FLIGHT (wandering swarms) ---------------------------------------------------------------------------
AimAngle = 70                               ; max heading deviation from the swarm->player line (0-90 deg)
SpeedMin = 6                                ; km/h, random in the range
SpeedMax = 12                               ; km/h
; height in m above the surface: the swarm flies level; outside Min..Max it smoothly climbs/descends at 45 deg
; to the nearest of OptimalFlightHeights (it is born at one of them)
FlightHeightMin = 1                         ; m above the surface - lowest level flight
FlightHeightMax = 5                         ; m above the surface - highest level flight
OptimalFlightHeights = 2, 3                 ; m - heights the swarm is born at and returns to
TurnRate = 35                               ; meandering: max turn in deg/s (0 = straight)

; ---------- PATTERNS (wandering swarms) - drawing shapes in the sky with the trail ------------------------------
; Every PatternInterval s the swarm stops wandering and draws shapes from patterns\<name>.txt (LOGO) with its trail,
; in the given order, side by side (e.g. Patterns = Heart, Star, Hello). Empty = no drawing. Needs FairyTrail = 1.
Patterns =                                  ; file names from the patterns folder, comma separated
PatternInterval = 30                        ; s of flight between drawings (counted from the birth of the swarm)
PatternPlane = Viewer                       ; Viewer = upright facing the player, Flight = upright along the flight, Ground = flat
PatternSpeed = 40                           ; km/h while drawing
PatternScale = 100                          ; % size (100 = 1 LOGO unit is 1 m)
PatternGap = 5                              ; m gap between consecutive shapes
PatternTrailLife = 20000                    ; ms trail life while drawing (0 = FairyTrailLife)
PatternContinuous = 0                       ; 1 = the trail does not break on the way to the drawing and between shapes

; ---------- PINNING to objects / peds / vehicles / the player ---------------------------------------------------
; AttachTo not empty: the groups are born on matching things within SpawnRadius of the player instead of on the
; ground. Levels / zones / hours / weather / Interiors still apply (at the thing's position); roads and water
; keys do not, and a pinned group never wanders. A group on a ped, a vehicle or the player follows it (AttachLag)
; and never collides with it (nor with the vehicle that ped sits in); when it disappears the group dies in a burst.
; A group on an object stays where the object stood.
AttachTo =                                  ; pin the groups to: player, anyped, anyvehicle, model names or IDs (e.g. kafka, 1211); empty = spawn on the ground (cheat FFNEAR logs nearby model IDs)
AttachOffset = 0, 0, 50                    ; cm - swarm centre in the entity frame: right, forward, up
AttachFrontAngle = 0                        ; degrees clockwise (seen from above) from the model front to the direction used as forward
AttachLag = 1000                            ; ms - the swarm trails behind a moving ped / vehicle / the player (0 = rigid)
AttachSnapDistance = 100                    ; m - farther than this (teleport) the swarm jumps instead of trailing
AttachScanInterval = 1000                   ; ms - how often to look for new things to attach to (bigger = faster game)
AttachCheckInterval = 3000                  ; ms - how often to check that the ped / vehicle still exists and still matches AttachTo (else the group dies)

; ---------- MOTION of the fireflies inside the group ------------------------------------------------------------
Jitter = 10                                 ; trembling in %
Wander = 80                                 ; smooth wandering (cm/s or something around it)
Attraction = 60                             ; pull towards the group centre (more = tighter)
WindDrift = 30                              ; % - blown by the weather wind (100 = like the game's own effects, 0 = calm in any weather)

; ---------- HITS AND ROTORS (-1 = as in [Effects] of the Base file) ---------------------------------------------
KillOnHit = -1                              ; -1 = as in [Effects], 0 = hits never kill this group, 1 = they do
KillByRotor = -1                            ; -1 = as in [Effects], 0 = rotors never kill this group, 1 = they do
KillOnHitSpeed = -1                         ; km/h, -1 = as in [Effects]
HitsToKill = -1                             ; -1 = as in [Effects], 0 = bumps never kill

; ---------- LOOK - every firefly picks a variant from the lists -------------------------------------------------
Sizes = 45, 55, 65                          ; % of the size, max 150
IdleSize = 100                              ; % size while not glowing
GlowSize = 100                              ; % size while flaring
; R,G,B variants separated by | - for the butterflies: the colour of the insect body (WingBody), paired with WingColors
Colors = 35,28,22 | 40,32,18 | 22,24,32 | 45,28,32 | 55,52,48 | 30,24,40 | 26,32,22 | 38,22,16
Brightness = 1                              ; % brightness while not glowing
GlowBrightness = 1                          ; % brightness while flaring
Lights = 0                                  ; 0 = this group never lights up the surroundings and never flares (point lights / coronas of [Glow] in the Base file) - e.g. butterflies
SameForGroup = 0                            ; 1 = the whole group has the same size and colour
; tilt on the screen in degrees, 0 = head up (sprites always face the camera, so this is the only turn they have);
; variants like Colors (0 | 180), ranges (-10..10) or both; empty = random. SameForGroup = 1: one angle per group
Rotation =                                  ; degrees

; ---------- CORE DISC - a disc with colour rings drawn under the glow (CoreDisc = 0 = off) ----------------------
CoreDisc = 0                                ; % of the glow radius - a solid disc in the firefly's colour under its glow (the glow adds up to a white centre); 0 = off
CoreDiscOpacity = 50                       ; % - how much the disc covers what is behind it (1-100)
CoreDiscBrightness = 100                    ; % - the disc's colours x this (1-100). Proper Shaders brightens what the plugin draws (~1.8x, more contrast, the same day and night): an opaque disc above ~55% clips towards white
CoreDiscColors =                            ; R,G,B | R,G,B ... from the centre outwards - the firefly's own colour is always the outer one; empty = one colour
CoreDiscGradient = 100                      ; % of each colour ring that blends into the next (0 = sharp rings, 100 = smooth gradient)
CoreDiscOverGlow = 0                        ; 1 = the disc covers the FX glow (the colours stay exactly as set), 0 = the glow is added on top (whiter centre)
CoreDiscGlow = 0                            ; % of the glow radius - an extra soft glow around the disc in the firefly's colour (0 = off)
CoreDiscGlowBrightness = 30                 ; % (1-100)

; ---------- FAIRY TRAIL - a glowing trail behind every firefly (in its colour, fades like smoke) ----------------
FairyTrail = 0                              ; 1 = on
FairyTrailRate = 15                         ; particles per second from each firefly (0-2000)
FairyTrailLife = 700                        ; ms - how long a particle lives and fades (50-120000)
FairyTrailSpread = 0                        ; cm - sideways spread from the flight path (0 = straight line, max 100000)
FairyTrailScatter = 0                       ; cm/s - drifting sideways away from the path (max 100000)
FairyTrailDrift = 0                         ; cm/s - vertical drift: negative down, positive up (+-100000)
FairyTrailDistance = 100                    ; m from the player within which fireflies leave a trail (1-250)
FairyTrailSize = 100                         ; % of the firefly size (1-500)
FairyTrailBrightness = 70                   ; % brightness at the start, then fades to 0 (1-100)

; ---------- FAIRY WINGS - butterfly wings on every firefly (glowing or solid - WingStyle) -----------------------
FairyWings = 2                              ; 1 = flat (camera-facing FX sprites, 4 extra FX particles per firefly), 2 = 3D (two real wings drawn by the plugin) - meant for small groups
; R,G,B variants separated by |, paired with Colors (1st colour with 1st wings...); empty = the firefly's own colour
WingColors = 255,140,0 | 255,215,0 | 70,130,255 | 255,80,160 | 240,240,240 | 150,90,255 | 80,200,120 | 255,60,40
WingSize = 120                              ; % - wing span relative to the firefly's glow sprite (5-300)
WingBrightness = 60                         ; % - glow wings: brightness | solid wings: their colours x this (Proper Shaders brightens what the plugin draws ~1.8x - about 55 gives the colours as set) (1-100)
WingCover = 100                             ; % - how much of what is behind a wing it hides: glow wings 0 = see-through glow (grass and water foam show through), 100 = hidden behind the wing | solid wings: opacity (100 = opaque)
; wing beat by flight speed: up to WingSpeedSlow the slow beat, from WingSpeedFast the full one, a smooth blend between
WingSpeedSlow = 2                           ; km/h - up to this flight speed the slow beat (and Wing3DPitchSlow) is used
WingSpeedFast = 12                          ; km/h - from this speed on the full beat (and Wing3DPitchFast); in between a smooth blend
WingFlapRateSlow = 5                        ; wing beats per second when (almost) hovering - up to WingSpeedSlow (0-30)
WingFlapDepthSlow = 100                     ; % of the full beat (spread -> closed) when hovering - a gentle flutter (0-100)
WingFlapRate = 9                            ; wing beats per second in fast flight - from WingSpeedFast on (0 = still, spread wings)
; 3D wings only (FairyWings = 2)
Wing3DOpenAngle = -15                       ; degrees - 3D wings (FairyWings = 2): angle above level when spread (-90..90)
Wing3DClosedAngle = 70                      ; degrees - 3D wings: angle above level when closed, at the top of the beat (-90..90)
Wing3DPitchSlow = 15                        ; degrees - 3D wings: body pitch when hovering (+ nose up, - nose down)
Wing3DPitchFast = 5                         ; degrees - 3D wings: body pitch in fast flight
Wing3DFacePlayer = 0                        ; m - 3D wings: within this distance the firefly turns to face the player (0 = off)
; 3D wings only: style, butterfly patterns, insect body
WingStyle = solid                           ; glow = glowing, see-through | solid = opaque, any colour (dark too); empty = WingStyle in [Look] of the Base file (flat wings always use that one)
WingPatterns = 1, 2, 3, 4                   ; 0 = fairy wings, 5 = water, 6 = wind, 7 = feathers with hearts, 8 = star, 9 = flame, 10 = dragonfly, 11 = beetle hind wing (fireflies) | butterflies (best with solid): 1 = monarch, 2 = swallowtail, 3 = eye spots, 4 = morpho; a list = one at random for every firefly, e.g. 0, 5, 6, 7
WingBody = 100                              ; % of the wing length - a body between the wings (WingBodyStyle), 0 = none
WingBodyStyle = insect                      ; insect = a slim body with antennae in the firefly's colour (Colors) x WingBrightness | firefly = a firefly beetle (pink shield, black wing covers, legs) whose tail glows in the firefly's colour - the FX glow then sits on the tail
WingBodyGlow = 100                          ; % - WingBodyStyle = firefly: glow of the tail, follows the firefly's brightness and flares (0 = never glows, max 300)
